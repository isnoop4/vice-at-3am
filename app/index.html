<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<link rel="icon" href="data:,">
<title>VICE AT 3 AM — GTA 6-style cover studio</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<header class="topbar">
  <div class="brand">
    <span class="brand-mark">VICE AT 3 AM</span>
    <span class="brand-sub">cold-blue night cover studio</span>
  </div>
  <p class="brand-note">Pick a panel, then a photo from the library. Drag the photo to position it. Export a real PNG.</p>
</header>
<main class="workspace">
  <section class="stage">
    <canvas id="preview" width="960" height="540" aria-label="Cover preview"></canvas>
    <p id="status" class="status">Ready — pick a panel, then a photo from the library.</p>
  </section>
  <aside class="editor">
    <section class="group">
      <h2>Cover text</h2>
      <label>Title <input id="title" value="VICE AT 3 AM" maxlength="24"></label>
      <label>Subtitle <input id="subtitle" value="one last summer in the city" maxlength="48"></label>
      <label>Tagline <input id="tagline" value="FIVE FRIENDS · ONE CITY · NO WAY BACK." maxlength="64"></label>
      <label>Press quote <input id="quote" value="PURE NEON MAYHEM" maxlength="48"></label>
    </section>
    <section class="group">
      <h2>Grade</h2>
      <div id="grades" class="choices"></div>
    </section>
    <section class="group">
      <h2>Layout</h2>
      <div id="layouts" class="choices"></div>
    </section>
    <section class="group">
      <h2>Export size</h2>
      <div id="sizes" class="choices"></div>
    </section>
    <section class="group">
      <h2>Panels</h2>
      <div id="panels" class="panels"></div>
      <label>Panel caption — role <input id="role" value="THE DRIVER" maxlength="20"></label>
      <div class="chip-row">
        <label>Place <input id="chip-place" value="NEON HARBOR" maxlength="20"></label>
        <label>Time <input id="chip-time" value="3:04 AM" maxlength="10"></label>
      </div>
      <label>Quip <input id="chip-quip" value="Catch me if you can." maxlength="40"></label>
      <label>Zoom <input id="zoom" type="range" min="1" max="2.5" step="0.05" value="1"></label>
    </section>
    <section class="group">
      <h2>Photo library</h2>
      <div id="library" class="library"></div>
      <label class="upload">Add your own photo
        <input id="upload" type="file" accept="image/*" multiple>
      </label>
    </section>
    <div class="actions">
      <button id="surprise" type="button">Surprise me</button>
      <button id="export" type="button" class="primary">Export PNG</button>
    </div>
  </aside>
</main>
<script type="module" src="src/main.js"></script>
</body>
</html>
